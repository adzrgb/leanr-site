<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEANr Admin | Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: #f8fafc;
    }
    
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .admin-header h1 {
      margin: 0;
      color: #0052cc;
    }
    
    .logout-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .logout-btn:hover {
      background: #b91c1c;
    }
    
    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #e2e8f0;
    }
    
    .tab-button {
      padding: 0.75rem 1.5rem;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #64748b;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .tab-button.active {
      color: #0052cc;
      border-bottom-color: #0052cc;
    }
    
    .tab-content {
      display: none;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .tab-content.active {
      display: block;
    }
    
    .orders-list {
      max-height: 600px;
      overflow-y: auto;
    }
    
    .order-card {
      border: 1px solid #e2e8f0;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      background: #f8fafc;
    }
    
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .order-header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .order-number {
      font-weight: 600;
      color: #0052cc;
    }
    
    .order-date {
      color: #64748b;
      font-size: 0.9rem;
    }

    .delete-order-btn {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .delete-order-btn:hover {
      background: #fecaca;
    }
    
    .order-customer {
      margin: 0.5rem 0;
      color: #0f172a;
    }
    
    .order-items {
      background: white;
      padding: 1rem;
      border-radius: 6px;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    
    .tracking-section {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    
    .tracking-input {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #0052cc;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    
    .send-tracking-btn {
      background: #0052cc;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    .send-tracking-btn:hover {
      background: #003d99;
    }
    
    .send-tracking-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    
    .stock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .stock-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 1.5rem;
      border-radius: 8px;
    }
    
    .stock-card h3 {
      margin: 0 0 1rem 0;
      color: #0052cc;
      font-size: 1.1rem;
    }
    
    .stock-form-group {
      margin-bottom: 1.25rem;
    }
    
    .stock-form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #0f172a;
      font-weight: 600;
      font-size: 0.95rem;
    }
    
    .stock-form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
      font-family: inherit;
    }
    
    .stock-form-group input:focus {
      outline: none;
      border-color: #0052cc;
      box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.1);
    }
    
    .stock-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    
    .save-stock-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: opacity 0.2s, transform 0.1s;
    }
    
    .save-stock-btn:hover:not(:disabled) {
      opacity: 0.9;
    }
    
    .save-stock-btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    
    .save-stock-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .reset-stock-btn {
      background: #6b7280;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    
    .reset-stock-btn:hover {
      opacity: 0.9;
    }
    
    .message {
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
    
    .message.success {
      background: #dcfce7;
      color: #15803d;
      display: block;
    }
    
    .message.error {
      background: #fee2e2;
      color: #dc2626;
      display: block;
    }
    
    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 2rem;
    }
    
    .payment-section {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
      padding: 1rem;
      background: white;
      border-radius: 6px;
    }
    
    .payment-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    
    .payment-status {
      flex: 1;
      font-weight: 600;
    }
    
    .payment-status.pending {
      color: #d97706;
    }
    
    .payment-status.confirmed {
      color: #10b981;
    }
    
    .confirm-payment-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    .confirm-payment-btn:hover {
      background: #059669;
    }
    
    .confirm-payment-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    
    /* Mobile / iPhone Responsive Styles */
    @media (max-width: 768px) {
      .admin-container {
        padding: 1rem;
      }
      
      .admin-header {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
        padding: 1rem;
      }
      
      .admin-header h1 {
        font-size: 1.5rem;
      }
      
      .logout-btn {
        width: 100%;
      }
      
      .tabs {
        gap: 0;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      
      .tab-button {
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        white-space: nowrap;
      }
      
      .tab-content {
        padding: 1.25rem;
      }
      
      .stock-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      
      .stock-card {
        padding: 1.25rem;
      }
      
      .stock-form-group input {
        padding: 0.875rem;
        font-size: 16px; /* Prevents auto-zoom on iOS */
      }
      
      .stock-actions {
        flex-direction: column;
      }
      
      .save-stock-btn,
      .reset-stock-btn {
        width: 100%;
        padding: 0.875rem 1.5rem;
      }
      
      .order-card {
        padding: 1rem;
      }
      
      .payment-section {
        flex-direction: column;
        gap: 0.75rem;
      }
      
      .payment-checkbox {
        width: 24px;
        height: 24px;
      }
      
      .confirm-payment-btn {
        width: 100%;
        padding: 0.875rem;
      }
    }
    
    @media (max-width: 480px) {
      .admin-container {
        padding: 0.75rem;
      }
      
      .tabs {
        margin-bottom: 1rem;
      }
      
      .tab-button {
        padding: 0.5rem 0.75rem;
        font-size: 0.85rem;
      }
      
      .stock-card h3 {
        font-size: 1rem;
      }
      
      .stock-form-group label {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>LEANr Admin Dashboard</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    
    <div class="tabs">
      <button class="tab-button active" onclick="switchTab('orders')">Orders</button>
      <button class="tab-button" onclick="switchTab('stock')">Stock Levels</button>
      <button class="tab-button" onclick="switchTab('revenue')">Revenue</button>
    </div>
    
    <!-- Orders Tab -->
    <div id="orders" class="tab-content active">
      <h2>Customer Orders</h2>
      <div id="orders-message" class="message"></div>
      <div id="orders-list" class="orders-list">
        <div class="empty-state">Loading orders...</div>
      </div>
    </div>
    
    <!-- Stock Tab -->
    <div id="stock" class="tab-content">
      <h2>Update Stock Levels</h2>
      <div id="stock-message" class="message"></div>
      <div class="stock-actions">
        <button class="save-stock-btn" id="save-stock-btn" onclick="saveAllStockChanges()">💾 Save All Changes</button>
        <button class="reset-stock-btn" id="reset-stock-btn" onclick="resetStockForm()">Reset Form</button>
      </div>
      <div class="stock-grid" id="stock-grid">
        <div class="empty-state">Loading products...</div>
      </div>
    </div>

    <!-- Revenue Tab -->
    <div id="revenue" class="tab-content">
      <h2>Revenue & Analytics</h2>
      <div id="revenue-message" class="message"></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
        <div style="background: linear-gradient(135deg, #0052cc, #003d99); color: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 12px rgba(0, 82, 204, 0.3);">
          <div style="font-size: 0.9rem; opacity: 0.9; margin-bottom: 0.5rem;">Total Revenue</div>
          <div id="total-revenue" style="font-size: 2.2rem; font-weight: bold;">£0.00</div>
        </div>
        <div style="background: linear-gradient(135deg, #ec4899, #be185d); color: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);">
          <div style="font-size: 0.9rem; opacity: 0.9; margin-bottom: 0.5rem;">Total Orders</div>
          <div id="total-orders" style="font-size: 2.2rem; font-weight: bold;">0</div>
        </div>
      </div>
      <div style="background: white; padding: 2rem; border-radius: 12px; border: 1px solid #e2e8f0;">
        <h3 style="margin-top: 0;">Top Selling Products</h3>
        <div id="top-products">
          <div class="empty-state">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Check authentication on page load
    window.addEventListener('load', () => {
      const token = localStorage.getItem('admin_token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      
      loadOrders();
      loadStockLevels();
      loadRevenue();
    });
    
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
      });
      
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }
    
    function logout() {
      localStorage.removeItem('admin_token');
      window.location.href = 'login.html';
    }
    
    async function loadOrders() {
      const token = localStorage.getItem('admin_token');
      
      try {
        const response = await fetch(window.location.origin + '/api/admin/orders', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!response.ok) {
          if (response.status === 401) {
            logout();
            return;
          }
          throw new Error('Failed to load orders');
        }
        
        const data = await response.json();
        const ordersList = document.getElementById('orders-list');
        
        if (!data.orders || data.orders.length === 0) {
          ordersList.innerHTML = '<div class="empty-state">No orders yet</div>';
          return;
        }
        
        ordersList.innerHTML = data.orders.map(order => `
          <div class="order-card">
            <div class="order-header">
              <span class="order-number">${order.orderNumber}</span>
              <div class="order-header-right">
                <span class="order-date">${new Date(order.timestamp).toLocaleDateString()}</span>
                <button class="delete-order-btn" onclick="deleteOrder('${order.orderNumber}', this)" title="Delete order" aria-label="Delete order">&times;</button>
              </div>
            </div>
            <div class="order-customer">
              <strong>${order.customerName}</strong><br>
              ${order.customerEmail}<br>
              ${order.customerPhone}
            </div>
            <div class="order-items">
              ${order.items.map(item => `
                ${item.name} (${item.option}) x${item.quantity} - £${(item.price * item.quantity).toFixed(2)}
              `).join('<br>')}
              <div style="margin-top: 0.5rem; font-weight: 600;">Total: £${order.total.toFixed(2)}</div>
            </div>
            <div class="tracking-section">
              <input type="text" class="tracking-input" placeholder="Enter tracking number..." value="${order.trackingNumber || ''}">
              <button class="send-tracking-btn" onclick="sendTracking('${order.orderNumber}', this)">
                ${order.trackingNumber ? 'Resend' : 'Send'} Tracking
              </button>
            </div>
            <div class="payment-section">
              <input type="checkbox" class="payment-checkbox" id="payment-${order.orderNumber}" ${order.paymentConfirmed ? 'checked disabled' : ''}>
              <span class="payment-status ${order.paymentConfirmed ? 'confirmed' : 'pending'}">
                ${order.paymentConfirmed ? '✓ Payment Confirmed' : '⚠ Payment Pending'}
              </span>
              <button class="confirm-payment-btn" onclick="confirmPayment('${order.orderNumber}', this)" ${order.paymentConfirmed ? 'disabled' : ''}>
                Confirm Payment
              </button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('orders-list').innerHTML = `<div class="empty-state">Error loading orders: ${error.message}</div>`;
      }
    }
    
    async function sendTracking(orderNumber, button) {
      const input = button.parentElement.querySelector('.tracking-input');
      const trackingNumber = input.value.trim();
      
      if (!trackingNumber) {
        alert('Please enter a tracking number');
        return;
      }
      
      const token = localStorage.getItem('admin_token');
      button.disabled = true;
      button.textContent = 'Sending...';
      
      try {
        const response = await fetch(window.location.origin + '/api/admin/send-tracking', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ orderNumber, trackingNumber })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          const msg = document.getElementById('orders-message');
          msg.className = 'message success';
          msg.textContent = 'Tracking number sent successfully!';
          setTimeout(() => msg.className = 'message', 3000);
        } else {
          alert(data.error || 'Failed to send tracking');
        }
      } catch (error) {
        alert('Error: ' + error.message);
      } finally {
        button.disabled = false;
        button.textContent = button.parentElement.querySelector('.tracking-input').value.trim() ? 'Resend Tracking' : 'Send Tracking';
      }
    }
    
    // Track stock changes
    let stockChanges = {};
    
    async function loadStockLevels() {
      try {
        const response = await fetch(window.location.origin + '/api/admin/stock', {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('admin_token')}` }
        });
        
        if (!response.ok) throw new Error('Failed to load stock');
        
        const data = await response.json();
        const grid = document.getElementById('stock-grid');
        
        // Reset changes tracker
        stockChanges = {};
        
        grid.innerHTML = data.stock.map(product => `
          <div class="stock-card">
            <h3>${product.name}</h3>
            ${product.variants ? product.variants.map(variant => `
              <div class="stock-form-group">
                <label>${variant.name}</label>
                <input 
                  type="number" 
                  min="0" 
                  value="${variant.stock}" 
                  data-product="${product.name}"
                  data-variant="${variant.name}"
                  onchange="trackStockChange(this)">
              </div>
            `).join('') : `
              <div class="stock-form-group">
                <label>Stock Level</label>
                <input 
                  type="number" 
                  min="0" 
                  value="${product.stock}"
                  data-product="${product.name}"
                  data-variant="default"
                  onchange="trackStockChange(this)">
              </div>
            `}
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('stock-grid').innerHTML = `<div class="empty-state">Error loading stock: ${error.message}</div>`;
      }
    }
    
    function trackStockChange(input) {
      const product = input.dataset.product;
      const variant = input.dataset.variant;
      const key = `${product}|${variant}`;
      
      stockChanges[key] = {
        productName: product,
        variant: variant,
        stock: parseInt(input.value)
      };
    }
    
    async function saveAllStockChanges() {
      const changes = Object.values(stockChanges);
      
      if (changes.length === 0) {
        const msg = document.getElementById('stock-message');
        msg.className = 'message';
        msg.textContent = 'No changes to save';
        return;
      }
      
      const btn = document.getElementById('save-stock-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Saving...';
      
      try {
        for (const change of changes) {
          const response = await fetch(window.location.origin + '/api/admin/update-stock', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${localStorage.getItem('admin_token')}`
            },
            body: JSON.stringify(change)
          });
          
          if (!response.ok) {
            throw new Error(`Failed to update ${change.productName}`);
          }
        }
        
        // Clear changes
        stockChanges = {};
        
        const msg = document.getElementById('stock-message');
        msg.className = 'message success';
        msg.textContent = `✓ Successfully saved ${changes.length} change${changes.length === 1 ? '' : 's'}!`;
        
        setTimeout(() => {
          msg.className = 'message';
        }, 3000);
        
      } catch (error) {
        const msg = document.getElementById('stock-message');
        msg.className = 'message error';
        msg.textContent = `✗ Error: ${error.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 Save All Changes';
      }
    }
    
    function resetStockForm() {
      stockChanges = {};
      loadStockLevels();
      const msg = document.getElementById('stock-message');
      msg.className = 'message';
      msg.textContent = '';
    }
    
    async function confirmPayment(orderNumber, button) {
      const checkbox = document.getElementById(`payment-${orderNumber}`);
      
      if (!checkbox.checked) {
        alert('Please check the checkbox first');
        return;
      }
      
      const token = localStorage.getItem('admin_token');
      button.disabled = true;
      button.textContent = 'Confirming...';
      
      try {
        const response = await fetch(window.location.origin + '/api/admin/confirm-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ orderNumber })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          const msg = document.getElementById('orders-message');
          msg.className = 'message success';
          msg.textContent = 'Payment confirmed! Email sent to customer.';
          setTimeout(() => msg.className = 'message', 4000);
          
          // Refresh orders list
          setTimeout(() => loadOrders(), 1000);
        } else {
          alert(data.error || 'Failed to confirm payment');
          button.disabled = false;
          button.textContent = 'Confirm Payment';
        }
      } catch (error) {
        alert('Error: ' + error.message);
        button.disabled = false;
        button.textContent = 'Confirm Payment';
      }
    }

    async function deleteOrder(orderNumber, button) {
      const confirmed = confirm(`Delete order ${orderNumber}? This cannot be undone.`);
      if (!confirmed) return;

      const token = localStorage.getItem('admin_token');
      button.disabled = true;

      try {
        const response = await fetch(window.location.origin + '/api/admin/delete-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ orderNumber })
        });

        const data = await response.json();

        if (response.ok) {
          const msg = document.getElementById('orders-message');
          msg.className = 'message success';
          msg.textContent = `Order ${orderNumber} deleted.`;
          setTimeout(() => msg.className = 'message', 3000);

          await loadOrders();
          await loadRevenue();
        } else {
          alert(data.error || 'Failed to delete order');
          button.disabled = false;
        }
      } catch (error) {
        alert('Error: ' + error.message);
        button.disabled = false;
      }
    }
    
    async function loadRevenue() {
      const token = localStorage.getItem('admin_token');
      
      try {
        const response = await fetch(window.location.origin + '/api/admin/stats', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!response.ok) {
          if (response.status === 401) {
            logout();
            return;
          }
          throw new Error('Failed to load stats');
        }
        
        const data = await response.json();
        
        // Update stats
        document.getElementById('total-revenue').textContent = data.totalRevenue;
        document.getElementById('total-orders').textContent = data.totalOrders;
        
        // Update top products
        const topProductsList = document.getElementById('top-products');
        if (data.topProducts && data.topProducts.length > 0) {
          topProductsList.innerHTML = data.topProducts.map(product => `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #e2e8f0;">
              <span style="font-weight: 600; color: #0f172a;">${product.name}</span>
              <span style="background: #e0f2fe; color: #0052cc; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600;">${product.sold} sold</span>
            </div>
          `).join('');
        } else {
          topProductsList.innerHTML = '<div class="empty-state">No sales data yet</div>';
        }
      } catch (error) {
        document.getElementById('total-revenue').textContent = 'Error';
        document.getElementById('total-orders').textContent = 'Error';
        document.getElementById('top-products').innerHTML = `<div class="empty-state">Error loading stats: ${error.message}</div>`;
      }
    }
  </script>
</body>
</html>
