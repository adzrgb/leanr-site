<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEANr Admin | Login</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0052cc, #ec4899);
      margin: 0;
    }
    
    .login-container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .login-header h1 {
      color: #0052cc;
      margin: 0;
      font-size: 1.8rem;
    }
    
    .login-header p {
      color: #64748b;
      margin: 0.5rem 0 0 0;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #0f172a;
      font-weight: 600;
      font-size: 0.95rem;
    }
    
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #0052cc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
    }
    
    .login-button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #0052cc, #ec4899);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .login-button:hover {
      transform: translateY(-2px);
    }
    
    .login-button:active {
      transform: translateY(0);
    }
    
    .error-message {
      color: #dc2626;
      background: #fee2e2;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
    
    .success-message {
      color: #15803d;
      background: #dcfce7;
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }

    .logo-home-login {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 10;
    }

    .logo-home-login:hover {
      transform: scale(1.05);
      opacity: 0.8;
    }

    .logo-img-login {
      height: 2.5rem;
      width: auto;
    }
  </style>
</head>
<body>
  <a class="logo-home-login" href="index.html"><img src="logo.jpeg" alt="LEANr" class="logo-img-login" /></a>
  <div class="login-container">
    <div class="login-header">
      <h1>LEANr Admin</h1>
      <p>Owner Login</p>
    </div>
    
    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      
      <button type="submit" class="login-button">Login</button>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-message');
      const successMsg = document.getElementById('success-message');
      
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      
      try {
        const apiUrl = `${window.location.origin}/api/admin/login`;
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          localStorage.setItem('admin_token', data.token);
          successMsg.textContent = 'Login successful! Redirecting...';
          successMsg.style.display = 'block';
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 1000);
        } else {
          errorMsg.textContent = data.error || 'Invalid credentials';
          errorMsg.style.display = 'block';
        }
      } catch (error) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
